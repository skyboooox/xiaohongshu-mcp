services:
  xiaohongshu-mcp:
    # Build this fork so Bearer-token authentication is included.
    build:
      context: ..
      dockerfile: Dockerfile
    image: skyboooox/xiaohongshu-mcp:token-auth
    container_name: xiaohongshu-mcp
    restart: unless-stopped
    init: true
    tty: true
    volumes:
      - ./data:/app/data
      - ./images:/app/images
    environment:
      # Required by this fork. Requests to /mcp and /api/v1 must send
      # Authorization: Bearer <token>.
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
      - ROD_BROWSER_BIN=/opt/browser/chrome
      - COOKIES_PATH=/app/data/cookies.json
      - HOME=/app/data/home
      - XDG_CACHE_HOME=/app/data/cache
      - XDG_CONFIG_HOME=/app/data/config
    ports:
      - "18060:18060"
